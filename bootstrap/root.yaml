# Root app-of-apps: watches apps/ and creates one child Application per workload.
#   This same Application is declared by sutures modules/k8s/argocd.nix, which is what applies
#   it on the cluster (the single Nix -> Argo handoff). Keep the two in sync. Self-heal on,
#   prune off: adding a file in apps/ creates its child; removing one does not auto-delete.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alicevoid/staples
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
