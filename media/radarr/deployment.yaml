# radarr: movie manager: matches, renames and moves movies into /data/media/watch/movies.
#   On ephara next to the media, gated by Authelia (radarr.pvc.tools). No download client yet (stage 3):
#   for now it only imports and renames the existing library (JELLYFIN, stage 2b).
#   Runs as its own UID with group media (2000), so files stay alice-readable and Jellyfin-readable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volumes and a SQLite database: one pod at a time
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      nodeSelector:
        pvc.tools/storage: "true"
      securityContext:
        runAsUser: 2102
        runAsGroup: 2000   # media: new files and folders belong to the media group
        fsGroup: 2000
      containers:
        - name: radarr
          image: ghcr.io/home-operations/radarr:6.4.4.10685@sha256:1902ad2c08e9bac276ff9a1429af2eaa2f3c635a51f138f1b3eb734995171537
          env:
            - name: RADARR__SERVER__PORT
              value: "7878"
            # The image defaults to the develop branch. Updates come from the pinned image anyway,
            #   but the in-app update notices should follow the stable branch.
            - name: RADARR__UPDATE__BRANCH
              value: master
            # Authelia guards the route, so Radarr trusts it instead of asking for its own login.
            - name: RADARR__AUTH__METHOD
              value: External
            - name: RADARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
          ports:
            - containerPort: 7878
          readinessProbe:
            httpGet:
              path: /ping
              port: 7878
          livenessProbe:
            httpGet:
              path: /ping
              port: 7878
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: watch
              mountPath: /data/media/watch
            - name: host-ca
              mountPath: /etc/ssl/certs/ca-certificates.crt
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: watch
          persistentVolumeClaim:
            claimName: watch
        # host CA bundle from sutures (security.pki); restart the pod after a cacert update
        - name: host-ca
          hostPath:
            path: /etc/ssl/certs/ca-certificates.crt
            type: File
