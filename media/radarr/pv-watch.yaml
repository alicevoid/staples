# /data/media/watch on ephara, read-write, at the same path in the pod. The whole folder, so a
#   move inside it is an instant rename. Radarr manages only the root folders set in its UI.
#   Never add oddities/ or extras/.
#   Static local PV, bound only to radarr/watch (claimRef). Retain: deleting the PVC never touches the files.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: radarr-watch
spec:
  capacity:
    storage: 12Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: radarr
    name: watch
  local:
    path: /data/media/watch
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ephara
