# jellyfin: media server at watch.pvc.tools, on ephara next to the media (JELLYFIN, stage 1: restore).
#   Paths match the old Ubuntu server, so the restored database works unchanged:
#   /var/lib/jellyfin (data, config in config/), /var/cache/jellyfin, /media/jellyWD (read-only).
#   Hardware transcoding: the iGPU (QuickSync) through Intel's GPU device plugin (gpu.intel.com/i915).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 0   # stage 2a: stopped while the media moves to /data/media/watch
  strategy:
    type: Recreate   # RWO volumes: one pod at a time
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        pvc.tools/storage: "true"
      enableServiceLinks: false   # Jellyfin reads JELLYFIN_* env vars as settings
      securityContext:
        runAsUser: 2100
        runAsGroup: 2100
        fsGroup: 2100
        supplementalGroups: [ 303, 2000 ]   # render (/dev/dri/renderD128), media
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
          env:
            - name: HOME   # .NET keeps its data-protection keys in $HOME/.aspnet (the old server's layout)
              value: /var/lib/jellyfin
            - name: JELLYFIN_DATA_DIR
              value: /var/lib/jellyfin
            - name: JELLYFIN_CONFIG_DIR
              value: /var/lib/jellyfin/config
            - name: JELLYFIN_LOG_DIR
              value: /var/lib/jellyfin/log
            - name: JELLYFIN_CACHE_DIR
              value: /var/cache/jellyfin
            - name: XDG_CACHE_HOME
              value: /var/cache/jellyfin
            - name: JELLYFIN_PublishedServerUrl
              value: https://watch.pvc.tools
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
          ports:
            - containerPort: 8096
          # The first start migrates the old database, which can take minutes.
          startupProbe:
            httpGet:
              path: /health
              port: 8096
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 4Gi   # no CPU limit: software transcodes need bursts
              gpu.intel.com/i915: "1"   # /dev/dri from the Intel GPU plugin (apps/intel-gpu-plugin.yaml)
          volumeMounts:
            - name: data
              mountPath: /var/lib/jellyfin
            - name: cache
              mountPath: /var/cache/jellyfin
            - name: legacy
              mountPath: /media/jellyWD
              readOnly: true
            - name: host-ca
              mountPath: /etc/ssl/certs/ca-certificates.crt
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jellyfin-data
        - name: cache
          persistentVolumeClaim:
            claimName: jellyfin-cache
        - name: legacy
          persistentVolumeClaim:
            claimName: jellyfin-legacy
            readOnly: true
        # host CA bundle from sutures (security.pki); restart the pod after a cacert update
        - name: host-ca
          hostPath:
            path: /etc/ssl/certs/ca-certificates.crt
            type: File
