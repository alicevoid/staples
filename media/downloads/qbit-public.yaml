# qbit-public: qBittorrent for public torrents, behind PIA through gluetun (this pod's network only).
#   Downloads into /incomplete (NVMe), then moves once to /data/media/downloads/public/<category>.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbit-public
  namespace: downloads
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volumes: one pod at a time
  selector:
    matchLabels:
      app: qbit-public
  template:
    metadata:
      labels:
        app: qbit-public
    spec:
      nodeSelector:
        pvc.tools/storage: "true"
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      # DNS only through gluetun (over the tunnel); the default would leak lookups via CoreDNS.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
      initContainers:
        # Native sidecar: qBittorrent starts only after the startup probe sees the tunnel up.
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          restartPolicy: Always
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: private internet access
            - name: VPN_TYPE
              value: openvpn   # gluetun's native PIA support is OpenVPN only
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: gluetun-pia
                  key: username
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gluetun-pia
                  key: password
            # PIA forwards ports only on non-US servers; the port lasts 60 days while /gluetun persists.
            - name: PORT_FORWARD_ONLY
              value: "true"
            - name: SERVER_REGIONS
              value: CA Vancouver,CA Toronto,CA Montreal
            - name: VPN_PORT_FORWARDING
              value: "on"
            # gluetun wiki qBittorrent example. Down binds qBittorrent to lo: a second kill switch.
            #   Needs qBittorrent's localhost auth bypass.
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: >-
                /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
            - name: VPN_PORT_FORWARDING_DOWN_COMMAND
              value: >-
                /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            # Replies to pods, Services, the Gateway and probes (all 10.42/10.43) leave on eth0.
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: 10.42.0.0/16,10.43.0.0/16
          # The health server listens on localhost only.
          startupProbe:
            exec:
              command: [ "/gluetun-entrypoint", "healthcheck" ]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: [ "/gluetun-entrypoint", "healthcheck" ]
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: gluetun
              mountPath: /gluetun
            - name: tun
              mountPath: /dev/net/tun
      containers:
        - name: qbittorrent
          image: ghcr.io/home-operations/qbittorrent:5.3.0@sha256:5a858e61f94cf2712391db32ed03556576c700858f3e62c4c6fcde262443ebd8
          # umask 002 (the image has no UMASK env): files must be 664 for Sonarr and Radarr to
          #   hard-link them (fs.protected_hardlinks); at 644 they silently copy.
          command: [ "/usr/bin/catatonit", "--", "/bin/bash", "-c", "umask 002 && exec /entrypoint.sh" ]
          securityContext:
            runAsUser: 2103
            runAsGroup: 2000   # media
            runAsNonRoot: true
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: incomplete
              mountPath: /incomplete
            - name: downloads
              mountPath: /data/media/downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbit-public-config
        - name: incomplete
          persistentVolumeClaim:
            claimName: incomplete
        - name: gluetun
          persistentVolumeClaim:
            claimName: gluetun
        - name: downloads
          persistentVolumeClaim:
            claimName: qbit-public-downloads
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
# /data/media/downloads on ephara at the same path in the pod (no remote path mappings).
#   Never watch/: qBittorrent cannot touch the library. Retain: deleting the PVC keeps the files.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbit-public-downloads
spec:
  capacity:
    storage: 12Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: downloads
    name: qbit-public-downloads
  local:
    path: /data/media/downloads
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ephara
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbit-public-downloads
  namespace: downloads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: qbit-public-downloads
  resources:
    requests:
      storage: 12Ti
---
# Config, Web UI login, resume data. Backed up nightly.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbit-public-config
  namespace: downloads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
# Unfinished torrents on the NVMe (random writes fragment tank's 1M records). Not backed up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: incomplete
  namespace: downloads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 300Gi
---
# gluetun state: keeps the forwarded port across restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gluetun
  namespace: downloads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: qbit-public
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: qbit-public
  ports:
    - port: 8080
      targetPort: 8080
