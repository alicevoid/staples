# flaresolverr: solves Cloudflare challenges for Prowlarr indexers tagged "flaresolverr".
#   In-cluster only (no login, so no route). Goes out the home connection.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: downloads
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      nodeSelector:
        pvc.tools/storage: "true"
      containers:
        - name: flaresolverr
          # The image's own non-root user owns /app (Chromium profile); it is named, not numbered,
          #   so runAsNonRoot cannot verify it.
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
          env:
            - name: LOG_LEVEL
              value: info
            - name: TZ
              value: America/Los_Angeles
          ports:
            - containerPort: 8191
          readinessProbe:
            httpGet:
              path: /health
              port: 8191
          livenessProbe:
            httpGet:
              path: /health
              port: 8191
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
            - name: config
              mountPath: /config
      volumes:
        # Upstream wants a 256M tmpfs /tmp; Chromium crashes on the 64M default /dev/shm.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: downloads
spec:
  type: ClusterIP
  selector:
    app: flaresolverr
  ports:
    - port: 8191
      targetPort: 8191
