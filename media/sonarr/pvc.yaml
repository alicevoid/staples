# Media (see pv-media.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  namespace: sonarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: sonarr-media
  resources:
    requests:
      storage: 12Ti
---
# Config and SQLite database. local-path on ephara's NVMe, backed up nightly by ephara-pvc-backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  namespace: sonarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
