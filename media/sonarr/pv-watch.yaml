# /data/media/watch on ephara, read-write, at the same path in the pod. The whole folder, not only
#   shows/: imports from the old folders must be renames inside one mount (instant), not copies.
#   Only the root folders set in the Sonarr UI are managed. oddities/ and extras/ are never added.
#   Static local PV, bound only to sonarr/watch (claimRef). Retain: deleting the PVC never touches the files.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr-watch
spec:
  capacity:
    storage: 12Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: sonarr
    name: watch
  local:
    path: /data/media/watch
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ephara
