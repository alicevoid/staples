# /data/media on ephara at the same path in the pod. watch/ and downloads/ share this mount, so
#   imports are hard links. Never add oddities/ or extras/ as root folders.
#   Bound only to sonarr/media (claimRef). Retain: deleting the PVC keeps the files.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr-media
spec:
  capacity:
    storage: 12Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: sonarr
    name: media
  local:
    path: /data/media
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ephara
