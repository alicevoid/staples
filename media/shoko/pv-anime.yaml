# /data/media/watch/anime on ephara, read-only, at the path Jellyfin sees (/media/jellyWD/anime).
#   Shoko only hashes and reads. Same path as Jellyfin, so Shokofin's VFS links need no path mapping.
#   Static local PV, bound only to shoko/anime (claimRef). Retain: deleting the PVC never touches the files.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shoko-anime
spec:
  capacity:
    storage: 12Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: shoko
    name: anime
  local:
    path: /data/media/watch/anime
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ephara
