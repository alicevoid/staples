# shoko: anime metadata server. Hashes the files in anime/, matches them on AniDB by hash, and serves the
#   result to Jellyfin through the Shokofin plugin (JELLYFIN, stage 2b anime pilot). Gated by Authelia
#   (shoko.pvc.tools). Reads the media only; it never renames or moves files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoko
  namespace: shoko
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume and a SQLite database: one pod at a time
  selector:
    matchLabels:
      app: shoko
  template:
    metadata:
      labels:
        app: shoko
    spec:
      nodeSelector:
        pvc.tools/storage: "true"
      containers:
        - name: shoko
          # v5.3.3 is the newest stable release and the newest one Shokofin 6.0.5 supports.
          #   The entrypoint starts as root, then drops to PUID:PGID with gosu.
          image: shokoanime/server:v5.3.3@sha256:b841f8249c9edfba102e4072e2b2a3eae4179e5dd553f29e11b9898a44f1e836
          env:
            - name: PUID
              value: "2103"
            - name: PGID
              value: "2000"
            - name: TZ
              value: America/Los_Angeles
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
          ports:
            - containerPort: 8111
          readinessProbe:
            httpGet:
              path: /api/v3/Init/Status
              port: 8111
          livenessProbe:
            tcpSocket:
              port: 8111
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /home/shoko/.shoko
            - name: anime
              mountPath: /media/jellyWD/anime
              readOnly: true
            - name: host-ca
              mountPath: /etc/ssl/certs/ca-certificates.crt
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: anime
          persistentVolumeClaim:
            claimName: anime
            readOnly: true
        # host CA bundle from sutures (security.pki); restart the pod after a cacert update
        - name: host-ca
          hostPath:
            path: /etc/ssl/certs/ca-certificates.crt
            type: File
