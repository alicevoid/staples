# traefik.pvc.tools (Authelia-gated) -> api@internal (Traefik dashboard, at /dashboard/).
# Lives in kube-system because that's where the Traefik controller runs. Kept here with the
# rest of routing so a future Gateway-API swap touches one directory.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia
  namespace: kube-system
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Email
      - Remote-Name
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: kube-system
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`traefik.pvc.tools`)
      middlewares:
        - name: authelia
          namespace: kube-system
      services:
        - kind: TraefikService
          name: api@internal
  tls:
    certResolver: le
    domains:
      - main: pvc.tools
        sans:
          - '*.pvc.tools'
