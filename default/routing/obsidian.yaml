# obsidian.pvc.tools (CouchDB for LiveSync) -> couchdb :5984.
#   NO Authelia: LiveSync is a native (non-browser) client, so ForwardAuth/OIDC would break it.
#   Auth is CouchDB's own (require_valid_user); this route adds only TLS + a rate-limit for light
#   hardening of the public endpoint. Lives in ns obsidian alongside the service it targets.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: couchdb-ratelimit
  namespace: obsidian
spec:
  rateLimit:
    average: 100   # req/s per source IP (sustained)
    burst: 300     # short bursts (sync is chunky); loosen if a rebuild feels throttled
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: obsidian
  namespace: obsidian
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`obsidian.pvc.tools`)
      middlewares:
        - name: couchdb-ratelimit
          namespace: obsidian
      services:
        - name: couchdb
          port: 5984
  tls:
    certResolver: le
    domains:
      - main: pvc.tools
        sans:
          - '*.pvc.tools'
