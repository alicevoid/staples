# karakeep.pvc.tools (Authelia-gated).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia
  namespace: karakeep
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Email
      - Remote-Name
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: karakeep
  namespace: karakeep
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`karakeep.pvc.tools`)
      middlewares:
        - name: authelia
          namespace: karakeep
      services:
        - name: karakeep
          port: 3000
  tls:
    certResolver: le
    domains:
      - main: pvc.tools
        sans:
          - '*.pvc.tools'
