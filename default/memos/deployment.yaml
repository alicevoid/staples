# memos: notes app. Data (sqlite + attachments) on the memos-data PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos
  namespace: memos
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume: one pod at a time
  selector:
    matchLabels:
      app: memos
  template:
    metadata:
      labels:
        app: memos
    spec:
      containers:
        - name: memos
          image: neosmemo/memos:stable   # moving tag; pin a version for reproducible upgrades
          env:
            - name: MEMOS_MODE
              value: prod
            # MEMOS_PORT must be set explicitly; unset binds port 0 ("running on port 0")
            - name: MEMOS_PORT
              value: "5230"
            - name: MEMOS_DATA
              value: /var/opt/memos
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
          ports:
            - containerPort: 5230
          volumeMounts:
            - name: data
              mountPath: /var/opt/memos   # memos' default data dir
            - name: host-ca
              mountPath: /etc/ssl/certs/ca-certificates.crt
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: memos-data
        # host CA bundle from sutures (security.pki); restart the pod after a cacert update
        - name: host-ca
          hostPath:
            path: /etc/ssl/certs/ca-certificates.crt
            type: File
