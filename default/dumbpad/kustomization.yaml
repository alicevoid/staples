# custom/ holds the paste look: theme.css, the header dog, and a patched index.html.
# index.html is DumbPad 1.0.5's copy with 5 small edits (search "paste" and "custom/").
# On a DumbPad upgrade, take the new index.html and re-apply those edits.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dumbpad
resources:
  - namespace.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml
configMapGenerator:
  # the name gets a content hash, so any change here restarts the pod
  - name: dumbpad-custom
    files:
      - custom/index.html
      - custom/theme.css
      - custom/dog.js
      - custom/ascii_animator.js
