# custom/index.html is DumbPad 1.0.5's with 6 edits (search "paste" and "custom/").
# Redo them on a DumbPad upgrade.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dumbpad
resources:
  - namespace.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml
configMapGenerator:
  # hashed name: a change restarts the pod
  - name: dumbpad-custom
    files:
      - custom/index.html
      - custom/theme.css
      - custom/dog.js
      - custom/select.js
      - custom/ascii_animator.js
