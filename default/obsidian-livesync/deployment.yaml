# CouchDB for Obsidian LiveSync (placeholder + mindvirus DBs). Single-node, RWO -> Recreate.
# Admin creds from the out-of-band couchdb-secrets Secret. (LiveSync config + the run-as-couchdb
# quirk are written up in QUIRKS.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchdb
  namespace: obsidian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: couchdb
  template:
    metadata:
      labels:
        app: couchdb
    spec:
      securityContext:
        # run as couchdb (5984), not root, to skip the image's root-only chown-everything step
        # (it fails on the read-only config mount; see QUIRKS)
        runAsUser: 5984
        runAsGroup: 5984
        fsGroup: 5984   # lets couchdb (5984) write the PVC
      containers:
        - name: couchdb
          image: couchdb:3.4   # pin, not :latest
          env:
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: couchdb-secrets
                  key: username
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-secrets
                  key: password
          ports:
            - containerPort: 5984
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            - name: config
              mountPath: /opt/couchdb/etc/local.d/10-livesync.ini
              subPath: 10-livesync.ini   # single-file mount; don't clobber the entrypoint's docker.ini
          readinessProbe:
            tcpSocket:
              port: 5984
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5984
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: couchdb-data
        - name: config
          configMap:
            name: couchdb-config
