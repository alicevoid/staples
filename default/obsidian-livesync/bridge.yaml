# livesync-bridge: materializes the (plaintext) mindvirus CouchDB DB as .md files at
# /srv/vaults/mindvirus on pharika, bidirectionally, so a host/tmux Claude can read+write the AI
# vault. Runs as alice (1000:100) so the files are hers; reaches CouchDB in-cluster. Config is the
# out-of-band Secret `livesync-bridge-config` (holds the password, not in git). placeholder is
# never bridged (E2EE, device-only). Image/path quirks are in QUIRKS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livesync-bridge
  namespace: obsidian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livesync-bridge
  template:
    metadata:
      labels:
        app: livesync-bridge
    spec:
      securityContext:
        runAsUser: 1000    # alice
        runAsGroup: 100    # users
        fsGroup: 100
      nodeSelector:
        kubernetes.io/hostname: pharika   # hostPath lives on pharika
      containers:
        - name: bridge
          # upstream publishes no image; this is a current CI build of the source.
          # TODO: pin to @sha256:<digest> (kubectl get pod -o jsonpath imageID).
          image: ghcr.io/caiobcosta/livesync-bridge:latest
          env:
            # trust the host's NixOS CA bundle (mounted below), not Deno's built-in webpki roots
            - name: DENO_TLS_CA_STORE
              value: system
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
          volumeMounts:
            - name: host-ca
              mountPath: /etc/ssl/certs/ca-certificates.crt
              readOnly: true
            - name: config
              mountPath: /app/dat          # current image runs from /app; reads ./dat/config.json
              readOnly: true
            - name: vault
              mountPath: /app/data         # storage baseDir "data/mindvirus" -> /app/data/mindvirus
            - name: deno
              mountPath: /deno-dir   # writable Deno cache (we run as 1000, not the image user)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          secret:
            secretName: livesync-bridge-config   # key: config.json
        - name: vault
          hostPath:
            path: /srv/vaults
            type: Directory
        - name: deno
          emptyDir: {}   # ephemeral; bridge re-scans on restart (fine for a small vault)
        # host CA bundle from sutures (security.pki); restart the pod after a cacert update
        - name: host-ca
          hostPath:
            path: /etc/ssl/certs/ca-certificates.crt
            type: File
