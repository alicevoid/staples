# The canonical CouchDB settings Obsidian LiveSync needs: single_node (auto-creates the system
# DBs), require_valid_user (+ _except_for_up so /_up health checks pass), and CORS for Obsidian's
# origins (desktop/iOS/Android). Mounted via subPath so it doesn't clobber the entrypoint's
# docker.ini. Rationale in QUIRKS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: couchdb-config
  namespace: obsidian
data:
  10-livesync.ini: |
    [couchdb]
    single_node = true
    max_document_size = 50000000

    [chttpd]
    require_valid_user = true
    require_valid_user_except_for_up = true
    max_http_request_size = 4294967296
    bind_address = 0.0.0.0

    [chttpd_auth]
    require_valid_user = true

    [httpd]
    WWW-Authenticate = Basic realm="couchdb"
    enable_cors = true

    [cors]
    credentials = true
    origins = app://obsidian.md,capacitor://localhost,http://localhost
    methods = GET, PUT, POST, HEAD, DELETE
    headers = accept, authorization, content-type, origin, referer
    max_age = 3600
