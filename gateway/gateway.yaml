apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pvc-tools
  namespace: gateway
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.pvc.tools"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: pvc-tools-wildcard
      allowedRoutes:
        namespaces:
          from: All
