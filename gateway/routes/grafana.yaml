apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: pvc-tools
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.pvc.tools
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: authelia
              namespace: authelia
              port: 80
            http:
              path: /api/authz/ext-authz/
              allowedHeaders:
                - accept
                - cookie
                - proxy-authorization
                - x-forwarded-proto
              allowedResponseHeaders:
                - Remote-User
                - Remote-Groups
                - Remote-Email
                - Remote-Name
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
