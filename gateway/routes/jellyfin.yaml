# No Authelia filter: TV and phone apps cannot pass the gate. Jellyfin uses its own login.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  parentRefs:
    - name: pvc-tools
      namespace: gateway
      sectionName: https
  hostnames:
    - watch.pvc.tools
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
