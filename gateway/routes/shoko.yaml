# Admins only (Authelia rule in auth/authelia/configmap.yaml). Shoko also has its own login (Shokofin uses an API key).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shoko
  namespace: shoko
spec:
  parentRefs:
    - name: pvc-tools
      namespace: gateway
      sectionName: https
  hostnames:
    - shoko.pvc.tools
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: authelia
              namespace: authelia
              port: 80
            http:
              path: /api/authz/ext-authz/
              allowedHeaders:
                - accept
                - cookie
                - proxy-authorization
                - x-forwarded-proto
              allowedResponseHeaders:
                - Remote-User
                - Remote-Groups
                - Remote-Email
                - Remote-Name
      backendRefs:
        - name: shoko
          port: 8111
