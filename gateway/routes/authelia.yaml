apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: authelia
spec:
  parentRefs:
    - name: pvc-tools
      namespace: gateway
      sectionName: https
  hostnames:
    - auth.pvc.tools
  rules:
    - backendRefs:
        - name: authelia
          port: 80
