# Admins only (Authelia rule in auth/authelia/configmap.yaml). qBittorrent keeps its own login (break-glass).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbit
  namespace: downloads
spec:
  parentRefs:
    - name: pvc-tools
      namespace: gateway
      sectionName: https
  hostnames:
    - qbit.pvc.tools
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: authelia
              namespace: authelia
              port: 80
            http:
              path: /api/authz/ext-authz/
              allowedHeaders:
                - accept
                - cookie
                - proxy-authorization
                - x-forwarded-proto
              allowedResponseHeaders:
                - Remote-User
                - Remote-Groups
                - Remote-Email
                - Remote-Name
      backendRefs:
        - name: qbit-public
          port: 8080
