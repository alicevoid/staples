apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pvc-tools-wildcard
  namespace: gateway
spec:
  secretName: pvc-tools-wildcard
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - pvc.tools
    - "*.pvc.tools"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
