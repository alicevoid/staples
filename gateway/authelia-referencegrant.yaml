apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: external-auth
  namespace: authelia
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: memos
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: karakeep
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: monitoring
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: argocd
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: sonarr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: radarr
  to:
    - group: ""
      kind: Service
      name: authelia
