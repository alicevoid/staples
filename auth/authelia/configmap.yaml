# Authelia config without secrets. The users database and the OIDC, SMTP and session secrets
# are in the authelia-secrets Secret (mounted at /secrets), loaded as a second --config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.yml: |
    theme: auto

    server:
      address: tcp://0.0.0.0:9091

    log:
      level: info

    totp:
      issuer: pvc.tools

    authentication_backend:
      file:
        path: /secrets/users_database.yml

    # first matching rule wins
    access_control:
      default_policy: deny
      rules:
        - domain:
            - memos.pvc.tools
            - karakeep.pvc.tools
            - grafana.pvc.tools
          # password + TOTP, so a leaked password alone can't get in
          policy: two_factor
          subject:
            - group:friends
            - group:admins
        # admin UIs and paste: admins only
        - domain:
            - argocd.pvc.tools
            - hubble.pvc.tools
            - sonarr.pvc.tools
            - radarr.pvc.tools
            - prowlarr.pvc.tools
            - qbit.pvc.tools
            - paste.pvc.tools
          policy: two_factor
          subject:
            - group:admins

    session:
      # sessions survive Authelia restarts (cluster-internal, no password)
      redis:
        host: redis.authelia.svc.cluster.local
        port: 6379
      cookies:
        - domain: pvc.tools
          authelia_url: https://auth.pvc.tools
          # no default_redirection_url: a direct login stays on the portal; app logins return via `rd`
          name: authelia_session
          same_site: lax
          inactivity: 7d
          expiration: 1d       # without "remember me"
          remember_me: 3M

    # brute-force lockout
    regulation:
      max_retries: 3
      find_time: 2m
      ban_time: 5m

    storage:
      local:
        path: /data/db.sqlite3

    # enrol and reset mails through SMTP2GO; only the password is secret
    notifier:
      smtp:
        address: 'submission://mail.smtp2go.com:2525' # 2525 dodges ISP blocking of 25/587
        username: 'auth.pvc.tools' # SMTP2GO user names are unique across all accounts
        sender: 'Authelia <no-reply@pvc.tools>'
        subject: '[Authelia] {title}'
