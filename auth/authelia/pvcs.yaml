# authelia-data: sqlite auth DB (users, TOTP devices) + notifier state.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia-data
  namespace: authelia
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
# redis-data: session store (appendonly), so an Authelia restart doesn't log everyone out.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: authelia
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
