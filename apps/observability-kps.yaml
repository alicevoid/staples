# kube-prometheus-stack: Prometheus + Grafana + Alertmanager. Argo Helm app (upstream chart +
#   values from this repo via $values). releaseName must stay "kube-prometheus-stack", or Argo
#   installs a second stack instead of adopting this one (see README). ServerSideApply: the
#   operator CRDs exceed the client-side annotation limit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-kps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.8.1
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/monitoring/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/alicevoid/staples
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
