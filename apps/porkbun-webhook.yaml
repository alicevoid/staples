apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: porkbun-webhook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://porkbun.octabits.io
      chart: cert-manager-webhook-porkbun
      targetRevision: 2.0.8
      helm:
        releaseName: cert-manager-webhook-porkbun
        valueFiles:
          - $values/security/porkbun-webhook/values.yaml
    - repoURL: https://github.com/alicevoid/staples
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
