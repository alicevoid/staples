# routing: all IngressRoutes + per-namespace authelia forwardAuth Middlewares, spanning
#   several namespaces (each object sets its own). Traefik CRDs already exist (Nix traefik-crd),
#   so Argo only creates the CRs. sync-wave 2 so routes land after authelia + the app Services.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: routing
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/alicevoid/staples
    targetRevision: main
    path: default/routing
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system   # fallback only; every object declares its own namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
