# shoko: anime metadata server (AniDB by file hash) for the Shokofin plugin in Jellyfin. Manifests in media/shoko.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoko
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/alicevoid/staples
    targetRevision: main
    path: media/shoko
  destination:
    server: https://kubernetes.default.svc
    namespace: shoko
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
