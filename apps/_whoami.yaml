# Throwaway smoke-test (ARGOCD runbook step 2). Proves git -> Argo -> cluster end-to-end
# with zero risk. Delete this file + manifests/whoami/ once the loop is confirmed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/alicevoid/staples
    targetRevision: main
    path: manifests/whoami
  destination:
    server: https://kubernetes.default.svc
    namespace: whoami
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
