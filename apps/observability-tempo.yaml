# Tempo (traces, single-binary). Plain YAML under monitoring/tempo/. RE-ENABLED in this
# migration — it was commented out in observability.nix yet still Running on-cluster (the drift
# that motivated moving to Argo). Runbook step 5.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/alicevoid/staples
    targetRevision: main
    path: monitoring/tempo
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # automated:
    #   prune: true
    #   selfHeal: true
