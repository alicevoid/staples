# Alloy (log collection DaemonSet -> Loki). Plain YAML under monitoring/alloy/. Runbook step 5.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/alicevoid/staples
    targetRevision: main
    path: monitoring/alloy
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # automated:
    #   prune: true
    #   selfHeal: true
