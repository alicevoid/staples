# authelia: SSO login-wall + OIDC provider (+ redis session store). Manifests in auth/authelia.
#   Everything else's forwardAuth depends on this, so sync-wave 1 (after the apps it gates,
#   before routing) keeps it up ahead of the Middlewares that point at it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/alicevoid/staples
    targetRevision: main
    path: auth/authelia
  destination:
    server: https://kubernetes.default.svc
    namespace: authelia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
