# argocd.pvc.tools (Authelia-gated, admins only) -> argocd-server (server.insecure=true, :80).
#   Browser/UI gate only: you drive the CLI via `--core` locally, so forwardAuth never has to
#   deal with gRPC/non-browser clients. Behind the gate, ArgoCD signs in via native OIDC to
#   Authelia (argocd.nix); its own admin login is break-glass. Lives in argocd/ per the README's
#   reserved dir; when the Cilium/Gateway-API swap happens it rejoins the other routes as an HTTPRoute.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia
  namespace: argocd
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Email
      - Remote-Name
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`argocd.pvc.tools`)
      middlewares:
        - name: authelia
          namespace: argocd
      services:
        - name: argocd-server
          port: 80
  tls:
    certResolver: le
    domains:
      - main: pvc.tools
        sans:
          - '*.pvc.tools'
