# memos.pvc.tools (Authelia-gated). The forwardAuth Middleware is per-namespace to
# dodge cross-ns Traefik permissions; it's identical in every gated namespace.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia
  namespace: memos
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Email
      - Remote-Name
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: memos
  namespace: memos
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`memos.pvc.tools`)
      middlewares:
        - name: authelia
          namespace: memos
      services:
        - name: memos
          port: 5230
  tls:
    certResolver: le
    domains:
      - main: pvc.tools
        sans:
          - '*.pvc.tools'
