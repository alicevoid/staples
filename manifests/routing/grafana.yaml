# grafana.pvc.tools (Authelia-gated) -> the kube-prometheus-stack Grafana Service.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia
  namespace: monitoring
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Email
      - Remote-Name
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`grafana.pvc.tools`)
      middlewares:
        - name: authelia
          namespace: monitoring
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
  tls:
    certResolver: le
    domains:
      - main: pvc.tools
        sans:
          - '*.pvc.tools'
