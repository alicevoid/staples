# auth.pvc.tools — the Authelia login portal itself. NO forwardAuth gate on this one
# (it IS the gate). Wildcard LE cert via the `le` resolver (Traefik controller, in Nix).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authelia
  namespace: authelia
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`auth.pvc.tools`)
      services:
        - name: authelia
          port: 80
  tls:
    certResolver: le
    domains:
      - main: pvc.tools
        sans:
          - '*.pvc.tools'
