# Memos — notes app. Data (sqlite + attachments) on the memos-data PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos
  namespace: memos
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume can't attach to two pods at once
  selector:
    matchLabels:
      app: memos
  template:
    metadata:
      labels:
        app: memos
    spec:
      containers:
        - name: memos
          image: neosmemo/memos:stable   # moving tag (matches live); pin a version for reproducible upgrades
          env:
            - name: MEMOS_MODE
              value: prod
            # MEMOS_PORT must be set explicitly — unset binds port 0 ("running on port 0").
            - name: MEMOS_PORT
              value: "5230"
            - name: MEMOS_DATA
              value: /var/opt/memos
          ports:
            - containerPort: 5230
          volumeMounts:
            - name: data
              mountPath: /var/opt/memos   # Memos' default data dir
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: memos-data
