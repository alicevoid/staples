# whoami — throwaway smoke-test for the Argo git->cluster loop (ARGOCD runbook step 2).
# Zero state, zero dependencies. Delete the whole manifests/whoami/ dir + apps/_whoami.yaml
# once the loop is proven.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          ports:
            - containerPort: 80
